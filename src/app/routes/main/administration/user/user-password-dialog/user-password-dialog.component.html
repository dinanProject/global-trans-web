<div class="dialog-header">
	<div class="dialog-title-content">
		<h2>Change User Password</h2>

		<p class="dialog-subtitle">
			Set a new password for {{ data.fullName }}.
		</p>
	</div>

	<button
		type="button"
		class="dialog-close"
		[disabled]="isSaving"
		(click)="cancel()"
		aria-label="Close dialog"
	>
		<i class="fas fa-times"></i>
	</button>
</div>

<mat-dialog-content [formGroup]="form">
	<div class="user-summary">
		<span class="user-summary-icon">
			<i class="fas fa-user"></i>
		</span>

		<div>
			<strong>{{ data.fullName }}</strong>
			<span>{{ data.email }}</span>
		</div>
	</div>

	<div *ngIf="errorMessage" class="error-message">
		<i class="fas fa-exclamation-circle"></i>
		<span>{{ errorMessage }}</span>
	</div>

	<div class="form-group">
		<label for="new-password"> New Password <span>*</span> </label>

		<div class="password-control">
			<input
				id="new-password"
				[type]="showPassword ? 'text' : 'password'"
				class="form-control"
				[class.is-invalid]="hasError('password')"
				formControlName="password"
				placeholder="Minimum 8 characters"
				maxlength="100"
				autocomplete="new-password"
			/>

			<button
				type="button"
				class="password-toggle"
				(click)="showPassword = !showPassword"
				[disabled]="isSaving"
				aria-label="Toggle password visibility"
			>
				<i
					[class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"
				></i>
			</button>
		</div>

		<div *ngIf="hasError('password')" class="invalid-feedback d-block">
			Password must contain 8 to 100 characters.
		</div>
	</div>

	<div class="form-group mb-0">
		<label for="confirm-password">
			Confirm New Password <span>*</span>
		</label>

		<div class="password-control">
			<input
				id="confirm-password"
				[type]="showConfirmPassword ? 'text' : 'password'"
				class="form-control"
				[class.is-invalid]="
					hasError('confirmPassword') || passwordMismatch
				"
				formControlName="confirmPassword"
				placeholder="Repeat the new password"
				maxlength="100"
				autocomplete="new-password"
			/>

			<button
				type="button"
				class="password-toggle"
				(click)="showConfirmPassword = !showConfirmPassword"
				[disabled]="isSaving"
				aria-label="Toggle confirmation visibility"
			>
				<i
					[class]="
						showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'
					"
				></i>
			</button>
		</div>

		<div *ngIf="passwordMismatch" class="invalid-feedback d-block">
			Password confirmation does not match.
		</div>
	</div>
</mat-dialog-content>

<mat-dialog-actions>
	<button
		type="button"
		class="btn btn-light"
		[disabled]="isSaving"
		(click)="cancel()"
	>
		Cancel
	</button>

	<button
		type="button"
		class="btn btn-primary"
		[disabled]="isSaving"
		(click)="save()"
	>
		<span
			*ngIf="isSaving"
			class="spinner-border spinner-border-sm mr-2"
			aria-hidden="true"
		></span>

		{{ isSaving ? "Saving..." : "Change Password" }}
	</button>
</mat-dialog-actions>
