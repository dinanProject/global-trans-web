<div class="dialog-header">
	<div class="dialog-title-content">
		<h2>Change Password</h2>

		<p class="dialog-subtitle">
			Update your account password. You will need to sign in again.
		</p>
	</div>

	<button
		type="button"
		class="dialog-close"
		[disabled]="isSaving"
		(click)="cancel()"
		aria-label="Close dialog"
	>
		<i class="fas fa-times"></i>
	</button>
</div>

<mat-dialog-content [formGroup]="form">
	<div *ngIf="errorMessage" class="error-message">
		<i class="fas fa-exclamation-circle"></i>
		<span>{{ errorMessage }}</span>
	</div>

	<div class="security-note">
		<span class="security-note-icon">
			<i class="fas fa-shield-alt"></i>
		</span>

		<div>
			<strong>Secure your account</strong>
			<span> Use a password containing at least 8 characters. </span>
		</div>
	</div>

	<div class="form-group">
		<label for="current-password"> Current Password <span>*</span> </label>

		<div class="password-control">
			<input
				id="current-password"
				[type]="showCurrentPassword ? 'text' : 'password'"
				class="form-control"
				[class.is-invalid]="hasError('currentPassword')"
				formControlName="currentPassword"
				placeholder="Enter current password"
				maxlength="100"
				autocomplete="current-password"
			/>

			<button
				type="button"
				class="password-toggle"
				[disabled]="isSaving"
				(click)="showCurrentPassword = !showCurrentPassword"
				aria-label="Toggle current password visibility"
			>
				<i
					[class]="
						showCurrentPassword ? 'fas fa-eye-slash' : 'fas fa-eye'
					"
				></i>
			</button>
		</div>

		<div
			*ngIf="hasError('currentPassword')"
			class="invalid-feedback d-block"
		>
			Current password is required.
		</div>
	</div>

	<div class="form-group">
		<label for="new-password"> New Password <span>*</span> </label>

		<div class="password-control">
			<input
				id="new-password"
				[type]="showNewPassword ? 'text' : 'password'"
				class="form-control"
				[class.is-invalid]="hasError('newPassword')"
				formControlName="newPassword"
				placeholder="Minimum 8 characters"
				maxlength="100"
				autocomplete="new-password"
			/>

			<button
				type="button"
				class="password-toggle"
				[disabled]="isSaving"
				(click)="showNewPassword = !showNewPassword"
				aria-label="Toggle new password visibility"
			>
				<i
					[class]="
						showNewPassword ? 'fas fa-eye-slash' : 'fas fa-eye'
					"
				></i>
			</button>
		</div>

		<div *ngIf="hasError('newPassword')" class="invalid-feedback d-block">
			New password must contain 8 to 100 characters.
		</div>
	</div>

	<div class="form-group mb-0">
		<label for="confirm-password">
			Confirm New Password <span>*</span>
		</label>

		<div class="password-control">
			<input
				id="confirm-password"
				[type]="showConfirmPassword ? 'text' : 'password'"
				class="form-control"
				[class.is-invalid]="
					hasError('confirmPassword') || passwordMismatch
				"
				formControlName="confirmPassword"
				placeholder="Repeat new password"
				maxlength="100"
				autocomplete="new-password"
			/>

			<button
				type="button"
				class="password-toggle"
				[disabled]="isSaving"
				(click)="showConfirmPassword = !showConfirmPassword"
				aria-label="Toggle password confirmation visibility"
			>
				<i
					[class]="
						showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'
					"
				></i>
			</button>
		</div>

		<div *ngIf="passwordMismatch" class="invalid-feedback d-block">
			Password confirmation does not match.
		</div>
	</div>
</mat-dialog-content>

<mat-dialog-actions>
	<button
		type="button"
		class="btn btn-light"
		[disabled]="isSaving"
		(click)="cancel()"
	>
		Cancel
	</button>

	<button
		type="button"
		class="btn btn-primary"
		[disabled]="isSaving"
		(click)="save()"
	>
		<span
			*ngIf="isSaving"
			class="spinner-border spinner-border-sm mr-2"
			aria-hidden="true"
		></span>

		{{ isSaving ? "Changing..." : "Change Password" }}
	</button>
</mat-dialog-actions>
