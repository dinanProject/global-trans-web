<div class="not-found-page">
	<div class="not-found-card">
		<div class="not-found-visual" aria-hidden="true">
			<div class="visual-grid"></div>

			<div class="error-symbol">
				<div class="symbol-orbit symbol-orbit-large"></div>
				<div class="symbol-orbit symbol-orbit-small"></div>

				<div class="symbol-icon">
					<i class="fas fa-map-signs"></i>
				</div>
			</div>

			<div class="error-code">404</div>
		</div>

		<div class="not-found-content">
			<div class="eyebrow">
				<span class="eyebrow-dot"></span>
				Navigation Error
			</div>

			<h1>Page not found</h1>

			<p class="description">
				The page you are looking for may have been moved, renamed, or is
				no longer available.
			</p>

			<div class="requested-path">
				<div class="path-icon">
					<i class="fas fa-link"></i>
				</div>

				<div class="path-content">
					<span>Requested address</span>
					<strong>{{ requestedUrl }}</strong>
				</div>
			</div>

			<div class="help-message">
				<i class="fas fa-info-circle"></i>

				<span>
					Check the address or return to a page you previously
					visited.
				</span>
			</div>

			<div class="not-found-actions">
				<button
					type="button"
					class="btn btn-light action-button"
					(click)="goBack()"
				>
					<i class="fas fa-arrow-left"></i>
					Back
				</button>

				<button
					type="button"
					class="btn btn-primary action-button"
					(click)="goHome()"
				>
					<i class="fas fa-home"></i>
					Go to Home
				</button>
			</div>

			<div class="support-note">
				<span>Need assistance?</span>

				<a href="mailto:it.helpdesk@sahabatproperti.id">
					<i class="far fa-envelope"></i>
					support&#64;administrator@globaltransgroup.id
				</a>
			</div>
		</div>
	</div>
</div>
