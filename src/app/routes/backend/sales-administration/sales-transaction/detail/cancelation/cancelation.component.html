<h2 mat-dialog-title>Cancelation</h2>
<mat-dialog-content fxLayout="column">
	<ng-container *ngIf="isInitialized">
		<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()" fxLayout="column">
			<div fxLayout fxLayoutGap="10px">
				<div class="form-group required" fxFlex="140px">
					<label>Cancelation Date</label>
					<div class="input-group">
						<input [matDatepicker]="datePicker" class="form-control" formControlName="cancelationDate" />
						<div class="input-group-append">
							<button type="button" class="btn btn-primary" (click)="datePicker.open()"><i
									class="far fa-calendar-alt"></i></button>
						</div>
					</div>
					<mat-datepicker #datePicker></mat-datepicker>
				</div>
				<div class="form-group required" fxFlex>
					<label>Cancelation Type</label>
					<select class="form-control" formControlName="cancelationTypeId"
						[class.is-invalid]="cancelationTypeId.invalid && formSubmitAttempt">
						<option *ngFor="let c of cancelationTypes" [value]="c.typeId">{{ c.typeName }}</option>
					</select>
				</div>
			</div>
			<div class="form-group required mb-0">
				<label>Cancelation Notes</label>
				<textarea class="form-control" formControlName="cancelationNotes" rows="4"
					[class.is-invalid]="cancelationNotes.invalid && formSubmitAttempt"></textarea>
			</div>
		</form>
	</ng-container>
	<ng-container *ngIf="!isInitialized">
		<loading fxFlex="227px"></loading>
	</ng-container>
	<error-message>{{ errorMessage }}</error-message>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<span fxFlex></span>
	<button class="btn btn-primary" (click)="submit()">
		<i class="fa fa-save mr-1"></i> Save
	</button>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Close
	</button>
</mat-dialog-actions>
