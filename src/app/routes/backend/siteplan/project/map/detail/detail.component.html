<ng-container *ngIf="unit">
	<h2 mat-dialog-title>Sales Entry</h2>
	<mat-dialog-content fxLayout="column">
		<div fxLayout fxLayoutGap="10px">
			<div class="form-group" fxFlex>
				<label>Unit Name</label>
				<input class="form-control" [value]="unit.unitName" readonly>
			</div>
			<div class="form-group" fxFlex>
				<label>Project Name</label>
				<input class="form-control" [value]="unit.projectName" readonly>
			</div>
		</div>
		<div fxLayout fxLayoutGap="10px">
			<div class="form-group" fxFlex>
				<label>Unit Type</label>
				<input class="form-control" [value]="unit.unitTypeName" readonly>
			</div>
			<div class="form-group" fxFlex="60px">
				<label>LT</label>
				<input class="form-control" [value]="unit.lt" readonly>
			</div>
			<div class="form-group" fxFlex="60px">
				<label>LB</label>
				<input class="form-control" [value]="unit.lb" readonly>
			</div>
		</div>
		<div class="separator"></div>
		<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()" fxLayout="column">
			<div class="form-group">
				<label>Customer Name</label>
				<input class="form-control" formControlName="fullName"
					[class.is-invalid]="fullName.invalid && formSubmitAttempt">
			</div>
			<div fxLayout fxLayoutGap="10px">
				<div class="form-group" fxFlex>
					<label>Agent Name</label>
					<input class="form-control" formControlName="agentName"
						[class.is-invalid]="agentName.invalid && formSubmitAttempt">
				</div>
				<div class="form-group" fxFlex>
					<label>Lead Agent</label>
					<input class="form-control" formControlName="leadAgentName"
						[class.is-invalid]="leadAgentName.invalid && formSubmitAttempt">
				</div>
			</div>
			<div fxLayout fxLayoutGap="10px">
				<div class="form-group" fxFlex="130px">
					<label>Sales Date</label>
					<div class="input-group">
						<input [matDatepicker]="datePicker" class="form-control" (click)="datePicker.open()"
							formControlName="salesDate" readonly />
						<div class="input-group-append">
							<span class="input-group-text" (click)="datePicker.open()"><i
									class="far fa-calendar-alt"></i></span>
						</div>
						<mat-datepicker #datePicker></mat-datepicker>
					</div>
				</div>
				<div class="form-group" fxFlex>
					<label>Payment Method</label>
					<select class="form-control" formControlName="paymentMethodId"
						(change)="paymentMethodChanged($any($event.target).value)">
						<option value="1">Tunai Keras</option>
						<option value="2">Tunai Bertahap</option>
						<option value="3">KPR</option>
					</select>
				</div>
			</div>
			<div class="form-group" fxFlex>
				<label>Sales Price</label>
				<div class="input-group">
					<div class="input-group-prepend">
						<span class="input-group-text">Rp.</span>
					</div>
					<input class="form-control text-right" currencyMask formControlName="salesPrice" readonly />
				</div>
			</div>
			<div class="form-group mb-0">
				<label>Remark</label>
				<input class="form-control" formControlName="remark">
			</div>
		</form>
	</mat-dialog-content>
	<mat-dialog-actions fxLayout fxLayoutGap="10px">
		<span fxFlex></span>
		<button class="btn btn-primary" (click)="submit()">
			<i class="fa fa-save mr-1"></i> Save
		</button>
		<button mat-dialog-close class="btn btn-danger">
			<i class="fa fa-times mr-1"></i> Close
		</button>
	</mat-dialog-actions>
</ng-container>
<ng-container *ngIf="!unit">
	<loading></loading>
</ng-container>
