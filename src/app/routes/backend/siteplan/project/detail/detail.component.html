<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content fxLayout fxLayoutGap="20px">
	<div fxLayout="column" fxLayoutGap="10px" fxFlex="240px">
		<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()">
			<div class="form-group">
				<label>Project Name</label>
				<input class="form-control" formControlName="projectName"
					[class.is-invalid]="formSubmitAttempt && projectName.invalid">
			</div>
			<div class="form-group">
				<label>City</label>
				<input class="form-control" formControlName="city"
					[class.is-invalid]="formSubmitAttempt && city.invalid">
			</div>
			<div class="form-group">
				<label>Remark</label>
				<input class="form-control" formControlName="remark">
			</div>
			<div fxLayout fxLayoutGap="10px">
				<div class="form-group" fxFlex>
					<label>Project Type</label>
					<select class="form-control" formControlName="projectTypeId"
						[class.is-invalid]="formSubmitAttempt && projectTypeId.invalid">
						<option *ngFor="let projectType of projectTypes" [value]="projectType.projectTypeId">{{
							projectType.projectTypeName }}</option>
					</select>
				</div>
				<div class="form-group" fxFlex="130px">
					<label>Launching Date</label>
					<div class="input-group">
						<input [matDatepicker]="datePicker" class="form-control" (click)="datePicker.open()"
							formControlName="launchingDate"
							[class.is-invalid]="formSubmitAttempt && launchingDate.invalid" />
						<div class="input-group-append">
							<span class="input-group-text" (click)="datePicker.open()"><i
									class="far fa-calendar-alt"></i></span>
						</div>
						<mat-datepicker #datePicker></mat-datepicker>
					</div>
				</div>
			</div>
			<div class="form-group mb-0">
				<label>Company</label>
				<select class="form-control" formControlName="companyId"
					[class.is-invalid]="formSubmitAttempt && companyId.invalid">
					<option *ngFor="let company of companies" [value]="company.companyId">{{ company.companyName }}
					</option>
				</select>
			</div>
		</form>
	</div>
	<div fxFlex class="siteplan-image" fxLayout="column">
		<input type="file" class="d-none" accept="image/*" #uploadSiteplan (change)="uploadSiteplanChanged($event)" />
		<label>Siteplan Image :</label>
		<div fxFlex class="siteplan-image-holder" fxLayoutAlign="center center">
			<ng-container *ngIf="siteplanPath">
				<thumb [src]="siteplanPath" height="300px" width="300px"></thumb>
			</ng-container>
			<ng-container *ngIf="!siteplanPath">
				<button class="btn btn-primary" (click)="uploadSiteplan.click()"><i
						class="fas fa-cloud-upload-alt mr-2"></i>Upload Siteplan</button>
			</ng-container>
		</div>
	</div>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<button class="btn btn-primary" (click)="uploadSiteplan.click()"><i class="fas fa-cloud-upload-alt mr-2"></i>Upload
		Siteplan</button>
	<span fxFlex></span>
	<button class="btn btn-primary" (click)="submit()">
		<i class="fa fa-save mr-1"></i> Save
	</button>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Close
	</button>
</mat-dialog-actions>
