<h2 mat-dialog-title>Change Unit</h2>
<mat-dialog-content fxLayout="column" class="p-0">
	<ng-container *ngIf="isInitialized">
		<mat-table class="data-grid" fxFlex #dataGrid [dataSource]="dataSource" matSort matSortDisableClear>

			<ng-container matColumnDef="no">
				<mat-header-cell fxFlex="60px" mat-sort-header *matHeaderCellDef> No.
				</mat-header-cell>
				<mat-cell fxFlex="60px" *matCellDef="let row; let i = index">
					{{ i + 1 }}
				</mat-cell>
			</ng-container>

			<ng-container matColumnDef="unitName">
				<mat-header-cell fxFlex mat-sort-header *matHeaderCellDef></mat-header-cell>
				<mat-cell fxFlex *matCellDef="let row">{{ row.unitName }}</mat-cell>
			</ng-container>

			<ng-container matColumnDef="lt">
				<mat-header-cell fxFlex="60px" mat-sort-header *matHeaderCellDef>LT</mat-header-cell>
				<mat-cell fxFlex="60px" *matCellDef="let row">{{ row.lt }}</mat-cell>
			</ng-container>

			<ng-container matColumnDef="lb">
				<mat-header-cell fxFlex="60px" mat-sort-header *matHeaderCellDef>LT</mat-header-cell>
				<mat-cell fxFlex="60px" *matCellDef="let row">{{ row.lb }}</mat-cell>
			</ng-container>

			<ng-container matColumnDef="cashPrice">
				<mat-header-cell fxFlex="120px" mat-sort-header *matHeaderCellDef></mat-header-cell>
				<mat-cell fxFlex="120px" *matCellDef="let row">{{ row.cashPrice }}</mat-cell>
			</ng-container>

			<ng-container matColumnDef="actions">
				<mat-header-cell fxFlex="60px" *matHeaderCellDef></mat-header-cell>
				<mat-cell fxFlex="60px" *matCellDef="let row">
					<button class="btn btn-primary btn-sm" (click)="select(row)"><i class="fas fa-check"></i></button>
				</mat-cell>
			</ng-container>

			<mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
			<mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
		</mat-table>
	</ng-container>
	<ng-container *ngIf="!isInitialized">
		<div class="loading-container">
			<loading></loading>
		</div>
	</ng-container>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<span fxFlex></span>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Cancel
	</button>
</mat-dialog-actions>
