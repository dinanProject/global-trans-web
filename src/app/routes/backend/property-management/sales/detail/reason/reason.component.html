<h2 mat-dialog-title>Cancelation</h2>
<mat-dialog-content fxLayout="column">
	<div class="form-group required">
		<label>Cancelation Date</label>
		<div class="input-group">
			<input [matDatepicker]="datePicker" class="form-control" (click)="datePicker.open()"
				[(ngModel)]="cancelationDate" />
			<div class="input-group-append">
				<span class="input-group-text" (click)="datePicker.open()"><i class="far fa-calendar-alt"></i></span>
			</div>
			<mat-datepicker #datePicker></mat-datepicker>
		</div>
	</div>
	<div class="form-group mb-0 required">
		<label>Cancelation Reason</label>
		<textarea rows="4" class="form-control" [(ngModel)]="cancelationReason"
			[class.is-invalid]="!cancelationReason && formSubmitAttempt"></textarea>
	</div>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<span fxFlex></span>
	<button class="btn btn-primary" (click)="save()">
		<i class="fa fa-save mr-1"></i> Save
	</button>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Close
	</button>
</mat-dialog-actions>
