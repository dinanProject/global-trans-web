<ng-container *ngIf="isInitialized">
	<h2 mat-dialog-title>Payment Plan Detail</h2>
	<mat-dialog-content fxLayout="column">
		<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()" fxLayout="column">
			<!-- paymentSchemeId: number;
			priceAmount?: number;
			pricePercent?: number;
			remark?: string;
			sequence?: number;
			numberOfInstall?: number;
			interval?: number;
			intervalTypeId?: number;
			intervalFromId?: number;
			deductFromId?: number;
			deductAmount?: number;
			deductPercent?: number; -->
			<div fxFlex fxLayoutGap="10px">
				<div class="form-group" fxFlex>
					<label>Payment Scheme</label>
					<select class="form-control" formControlName="paymentSchemeId">
						<option *ngFor="let p of paymentSchemes" [value]="p.paymentSchemeId">{{ p.paymentSchemeName }}
						</option>
					</select>
				</div>
				<div class="form-group" fxFlex="50px">
					<label>Seq</label>
					<input class="form-control" formControlName="sequence">
				</div>
			</div>
			<div fxFlex fxLayoutGap="10px">
				<div class="form-group" fxFlex>
					<label>Price Amount</label>
					<div class="input-group">
						<div class="input-group-prepend">
							<span class="input-group-text">
								IDR.
							</span>
						</div>
						<input currencyMask [options]="{ prefix: ''}" class="form-control"
							formControlName="priceAmount">
					</div>
				</div>
				<div class="form-group" fxFlex="90px">
					<label>Price %</label>
					<div class="input-group">
						<input type="text" class="form-control" formControlName="pricePercent">
						<div class="input-group-append">
							<span class="input-group-text">
								%
							</span>
						</div>
					</div>
				</div>
			</div>
			<div fxFlex fxLayoutGap="10px">
				<div class="form-group" fxFlex="50px">
					<label>Count</label>
					<input class="form-control" formControlName="numberOfInstall">
				</div>
				<div class="form-group" fxFlex="130px">
					<label>Interval</label>
					<div class="input-group">
						<input class="form-control" formControlName="interval">
						<div class="input-group-append">
							<select class="form-control" formControlName="intervalTypeId">
								<option *ngFor="let i of intervalTypes" [value]="i.intervalTypeId">{{ i.intervalTypeName
									}}
								</option>
							</select>
						</div>
					</div>
				</div>
				<div class="form-group" fxFlex>
					<label>Interval From</label>
					<select class="form-control" formControlName="intervalFromId">
						<option></option>
						<option *ngFor="let i of intervalFroms" [value]="i.intervalFromId">{{ i.intervalFromName }}
						</option>
					</select>
				</div>
			</div>
			<div fxFlex fxLayoutGap="10px">
				<div class="form-group" fxFlex>
					<label>Deduct. Amount</label>
					<div class="input-group">
						<div class="input-group-prepend">
							<span class="input-group-text">
								IDR.
							</span>
						</div>
						<input currencyMask [options]="{ prefix: ''}" class="form-control"
							formControlName="deductAmount">
					</div>
				</div>
				<div class="form-group" fxFlex="90px">
					<label>Deduct. %</label>
					<div class="input-group">
						<input type="text" class="form-control" formControlName="deductPercent">
						<div class="input-group-append">
							<span class="input-group-text">
								%
							</span>
						</div>
					</div>
				</div>
			</div>
			<div class="form-group mb-0" fxFlex>
				<label>Deduct. From</label>
				<select class="form-control" formControlName="deductFromId">
					<option></option>
					<option *ngFor="let i of intervalFroms" [value]="i.intervalFromId">{{ i.intervalFromName }}
					</option>
				</select>
			</div>
		</form>
	</mat-dialog-content>
	<mat-dialog-actions fxLayout fxLayoutGap="10px">
		<span fxFlex></span>
		<button class="btn btn-primary" (click)="save()">
			<i class="fa fa-save mr-1"></i> Save
		</button>
		<button mat-dialog-close class="btn btn-danger">
			<i class="fa fa-times mr-1"></i> Close
		</button>
	</mat-dialog-actions>
</ng-container>
<ng-container *ngIf="!isInitialized">
	<loading></loading>
</ng-container>
