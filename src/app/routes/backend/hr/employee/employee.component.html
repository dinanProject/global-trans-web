<div class="page-header">
	<div class="form-group" fxFlex>
		<label>Search</label>
		<div class="input-group">
			<input type="text" class="form-control" placeholder="Search.." (keyup)="searchChanged($event)">
			<div class="input-group-append">
				<span class="input-group-text">
					<i class="fas fa-search"></i>
				</span>
			</div>
		</div>
	</div>
	<div class="form-group" fxFlex="180px">
		<label>Occupation</label>
		<select class="form-control" (change)="occupationChanged($event)">
			<option>All</option>
			<option *ngFor="let o of occupationNames" [value]="o">{{ o }}</option>
		</select>
	</div>
	<div class="form-group" fxFlex="140px">
		<label>Department</label>
		<select class="form-control" (change)="departmentChanged($event)">
			<option>All</option>
			<option *ngFor="let d of departmentNames" [value]="d">{{ d }}</option>
		</select>
	</div>
	<div class="form-group" fxFlex="140px">
		<label>Company</label>
		<select class="form-control" (change)="companyChanged($event)">
			<option>All</option>
			<option *ngFor="let c of companyNames" [value]="c">{{ c }}</option>
		</select>
	</div>
</div>
<div class="container-fluid page-body">
	<div class="panel panel-employee">
		<div class="panel-body p-0">
			<ng-container *ngIf="isInitialized">
				<mat-table class="data-grid" #dataGrid [dataSource]="dataSource" matSort matSortDisableClear>

					<ng-container matColumnDef="no">
						<mat-header-cell fxFlex="60px" mat-sort-header *matHeaderCellDef> No.
						</mat-header-cell>
						<mat-cell fxFlex="60px" *matCellDef="let row; let i = index">
							{{ i + 1 }}
						</mat-cell>
					</ng-container>

					<ng-container matColumnDef="employeeCode">
						<mat-header-cell fxFlex="100px" mat-sort-header *matHeaderCellDef>Code</mat-header-cell>
						<mat-cell fxFlex="100px" *matCellDef="let row">{{ row.employeeCode }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="fullName">
						<mat-header-cell fxFlex mat-sort-header *matHeaderCellDef>Employee Name</mat-header-cell>
						<mat-cell fxFlex *matCellDef="let row">{{ row.fullName }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="occupationName">
						<mat-header-cell fxFlex="180px" mat-sort-header *matHeaderCellDef>Occupation</mat-header-cell>
						<mat-cell fxFlex="180px" *matCellDef="let row">{{ row.occupationName }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="departmentName">
						<mat-header-cell fxFlex="180px" mat-sort-header *matHeaderCellDef>Department</mat-header-cell>
						<mat-cell fxFlex="180px" *matCellDef="let row">{{ row.departmentName }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="companyName">
						<mat-header-cell fxFlex="200px" mat-sort-header *matHeaderCellDef>Company</mat-header-cell>
						<mat-cell fxFlex="200px" *matCellDef="let row">{{ row.companyName }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="actions">
						<mat-header-cell fxFlex="60px" *matHeaderCellDef></mat-header-cell>
						<mat-cell fxFlex="60px" *matCellDef="let row">
							<a class="btn btn-primary btn-sm" [routerLink]="[ row.employeeId ]"><i
									class="fas fa-pen"></i></a>
						</mat-cell>
					</ng-container>

					<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
					<mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
				</mat-table>
			</ng-container>
			<ng-container *ngIf="!isInitialized">
				<div class="loading-container">
					<loading></loading>
				</div>
			</ng-container>
			<mat-paginator [pageSizeOptions]="[10, 50, 100]" showFirstLastButtons></mat-paginator>
		</div>
	</div>
</div>
