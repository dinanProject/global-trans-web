<h2 mat-dialog-title>Role</h2>
<mat-dialog-content fxLayout="column" fxLayoutGap="20px">
	<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="save()">
		<div class="form-group">
			<label>Role Name</label>
			<input class="form-control" formControlName="roleName"
				[class.is-invalid]="roleName.invalid && formSubmitAttempt">
		</div>
		<div class="form-group mb-0">
			<label>Remark</label>
			<input class="form-control" formControlName="remark"
				[class.is-invalid]="roleName.invalid && formSubmitAttempt">
		</div>
	</form>
	<div class="tabs">
		<ul class="tab-header" fxLayout>
			<li fxFlex [class.active]="activeTab === 'menu-and-functions'" (click)="activeTab = 'menu-and-functions'">
				Menu and Functions
			</li>
			<li fxFlex [class.active]="activeTab === 'users'" (click)="activeTab = 'users'">
				Users
			</li>
		</ul>
		<ul class="tab-content">
			<li [fxShow]="activeTab === 'menu-and-functions'" fxLayout="column">
				<div fxFlex class="scroll scroll-y">
					<ul class="menus">
						<ng-container *ngFor="let menu of menus">
							<menu-tree [menu]="menu" (changed)="childChange($event)"></menu-tree>
						</ng-container>
					</ul>
				</div>
			</li>
			<li [fxShow]="activeTab === 'users'">
				users
			</li>
		</ul>
	</div>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<span fxFlex></span>
	<!-- <button class="btn btn-primary" (click)="save()">
		<i class="fa fa-save mr-1"></i> Save
	</button> -->
	<button class="btn btn-primary" (click)="save()" [disabled]="isSaving">
		<ng-container *ngIf="isSaving">
			<span class="spinner-border text-light spinner-border-sm mr-2"></span>
			Saving...
		</ng-container>
		<ng-container *ngIf="!isSaving">
			<i class="fa fa-save mr-1"></i> Save
		</ng-container>
	</button>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Close
	</button>
</mat-dialog-actions>
