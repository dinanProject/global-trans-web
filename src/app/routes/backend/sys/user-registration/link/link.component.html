<h2 mat-dialog-title>{{mode === 'create' ? 'Create' : 'View'}} Link</h2>
<mat-dialog-content fxLayout="column">
	<ng-container *ngIf="mode === 'create'">
		<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()" fxLayout="column">
			<div class="form-group mb-0">
				<label>Link Name</label>
				<input class="form-control" formControlName="linkName"
					[class.is-invalid]="linkName.invalid && formSubmitAttempt" />
			</div>
		</form>
	</ng-container>
	<ng-container *ngIf="mode === 'view'">
		<qrcode [qrdata]="link" [width]="256" [errorCorrectionLevel]="'M'"
			[imageSrc]="'./assets/images/logo-raya-40x40.png'" [imageHeight]="40" [imageWidth]="40" [width]="320">
		</qrcode>
		<div class="form-group mb-0">
			<label>Link</label>
			<input class="form-control" [(ngModel)]="link">
		</div>
	</ng-container>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<ng-container *ngIf="mode === 'create'">
		<span fxFlex></span>
		<button class="btn btn-primary" (click)="submit()">
			<i class="fa fa-save mr-1"></i> Save
		</button>
		<button mat-dialog-close class="btn btn-danger">
			<i class="fa fa-times mr-1"></i> Close
		</button>
	</ng-container>
	<ng-container *ngIf="mode === 'view'">
		<button class="btn btn-primary btn-block" [cdkCopyToClipboard]="link">Copy</button>
	</ng-container>
</mat-dialog-actions>
