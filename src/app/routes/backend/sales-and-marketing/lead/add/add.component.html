<ng-container *ngIf="isInitialized">
	<h2 mat-dialog-title>Add Lead</h2>
	<mat-dialog-content fxLayout="column">
		<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()" fxLayout="column">
			<div class="form-group">
				<label>Lead Name</label>
				<input class="form-control" formControlName="leadName"
					[class.is-invalid]="leadName.invalid && formSubmitAttempt">
			</div>
			<div class="form-group">
				<label>Location</label>
				<input class="form-control" formControlName="locationName"
					[class.is-invalid]="leadName.invalid && formSubmitAttempt">
			</div>
			<div class="form-group">
				<label>Phone Number</label>
				<input class="form-control" formControlName="phoneNumber"
					[class.is-invalid]="leadName.invalid && formSubmitAttempt">
			</div>
			<div class="form-group mb-0">
				<label>Source</label>
				<select class="form-control" formControlName="sourceId">
					<option *ngFor="let s of sources" [value]="s.sourceId">{{ s.sourceName }}</option>
				</select>
			</div>
		</form>
	</mat-dialog-content>
	<mat-dialog-actions fxLayout fxLayoutGap="10px">
		<span fxFlex></span>
		<button class="btn btn-primary" (click)="submit()">
			<i class="fa fa-save mr-1"></i> Save
		</button>
		<button mat-dialog-close class="btn btn-danger">
			<i class="fa fa-times mr-1"></i> Close
		</button>
	</mat-dialog-actions>
</ng-container>
<ng-container *ngIf="!isInitialized">
	<loading></loading>
</ng-container>
