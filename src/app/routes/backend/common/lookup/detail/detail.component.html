<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content fxLayout="column" fxLayoutGap="10px">
	<div class="error-message" *ngIf="errorMessage">
		{{ errorMessage }}
	</div>
	<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()">
		<div fxLayout fxLayoutGap="20px">
			<div class="form-group" fxFlex="60px">
				<label>Lookup Id</label>
				<input class="form-control" formControlName="lookupId"
					[class.is-invalid]="formSubmitAttempt && lookupId.invalid">
			</div>
			<div class="form-group" fxFlex>
				<label>Lookup Name</label>
				<input class="form-control" formControlName="lookupName"
					[class.is-invalid]="formSubmitAttempt && lookupName.invalid">
			</div>
		</div>
		<div fxLayout fxLayoutGap="20px">
			<div class="form-group" fxFlex>
				<label>Lookup Value</label>
				<input class="form-control" formControlName="lookupValue"
					[class.is-invalid]="formSubmitAttempt && lookupValue.invalid">
			</div>
			<div class="form-group" fxFlex>
				<label>Lookup Group</label>
				<input class="form-control" formControlName="lookupGroup"
					[class.is-invalid]="formSubmitAttempt && lookupGroup.invalid">
			</div>
		</div>
		<div class="form-group">
			<label>Remark</label>
			<input class="form-control" formControlName="remark">
		</div>
	</form>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<span fxFlex></span>
	<button class="btn btn-primary" (click)="submit()">
		<i class="fa fa-save mr-1"></i> Save
	</button>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Close
	</button>
</mat-dialog-actions>
