<li class="city">
	<div fxLayout fxLayoutAlign="start center" (click)="toggle()">
		<span [fxFlex]="(city.level * 30) + 'px'"></span>
		<div class="toggler" fxFlex="30px" fxLayoutAlign="center center">
			<ng-container *ngIf="city.isLoading">
				<i class="fa fa-spinner fa-pulse"></i>
			</ng-container>
			<ng-container *ngIf="!city.isLoading">
				<ng-container *ngIf="!city.expanded">
					<i class="fa fa-chevron-right" aria-hidden="true"></i>
				</ng-container>
				<ng-container *ngIf="city.expanded">
					<i class="fa fa-chevron-down" aria-hidden="true"></i>
				</ng-container>
			</ng-container>
		</div>
		<div fxFlex fxLayout="column">{{ city.cityName }}</div>
		<div fxFlex="160px" fxLayout="column">Kota</div>
		<div fxFlex="60px" fxLayout fxLayoutGap="5px">

		</div>
	</div>
	<ul *ngIf="city.districts && city.districts.length > 0 && city.expanded">
		<ng-container *ngFor="let district of city.districts">
			<district-tree [district]="district" [cityId]="city.cityId">
			</district-tree>
		</ng-container>
	</ul>
</li>
