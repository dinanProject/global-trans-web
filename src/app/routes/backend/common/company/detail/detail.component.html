<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content fxLayout="column" fxLayoutGap="10px">
	<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()">
		<div class="form-group">
			<label>Parent Name</label>
			<input class="form-control" formControlName="parentName">
		</div>
		<div class="form-group">
			<label>Company Name</label>
			<input class="form-control" formControlName="companyName"
				[class.is-invalid]="formSubmitAttempt && companyName.invalid">
		</div>
		<div class="form-group">
			<label>Remark</label>
			<input class="form-control" formControlName="remark">
		</div>
		<div class="form-group">
			<label>Address</label>
			<textarea class="form-control" formControlName="address" rows="3"></textarea>
		</div>
	</form>
</mat-dialog-content>
<mat-dialog-actions fxLayout fxLayoutGap="10px">
	<span fxFlex></span>
	<button class="btn btn-primary" (click)="submit()">
		<i class="fa fa-save mr-1"></i> Save
	</button>
	<button mat-dialog-close class="btn btn-danger">
		<i class="fa fa-times mr-1"></i> Close
	</button>
</mat-dialog-actions>
