<li class="company">
	<div fxLayout fxLayoutAlign="start center">
		<span [fxFlex]="(company.level * 30) + 'px'"></span>
		<i class="far fa-building" fxFlex="30px" fxLayout fxLayoutAlign="start center"></i>
		<!-- <i class="fas fa-sitemap" fxFlex="30px" fxLayout fxLayoutAlign="start center"></i> -->
		<div fxFlex fxLayout="column">
			<h2>{{ company.companyName }}</h2>
			<h5>{{ company.remark }}</h5>
		</div>
		<div fxLayout fxLayoutGap="5px">
			<!-- <button class="btn btn-primary btn-sm"><i class="fas fa-plus"></i></button>
			<button class="btn btn-primary btn-sm"><i class="fas fa-pen"></i></button>
			<button class="btn btn-danger btn-sm"><i class="far fa-trash-alt"></i></button> -->
			<button mat-icon-button [matMenuTriggerFor]="menu">
				<mat-icon>more_vert</mat-icon>
			</button>
			<mat-menu #menu="matMenu">
				<button mat-menu-item class="menu-success" (click)="addCompany()">
					<i class="fas fa-plus"></i>
					<span>Add Company</span>
				</button>
				<button mat-menu-item class="menu-primary" (click)="editCompany()">
					<i class="fas fa-pen"></i>
					<span>Edit Company</span>
				</button>
				<ng-container *ngIf="
					company.child.length === 0">
					<button mat-menu-item class="menu-danger" (click)="deleteCompany()">
						<i class="far fa-trash-alt"></i>
						<span>Delete Company</span>
					</button>
				</ng-container>
			</mat-menu>
		</div>
	</div>
	<ul *ngIf="company.child">
		<ng-container *ngFor="let company of company.child">
			<company-tree [company]="company" (companyAdded)="companyAdded.emit($event)"
				(companyEdited)="companyEdited.emit($event)" (companyDeleted)="companyDeleted.emit($event)">
			</company-tree>
		</ng-container>
	</ul>
</li>
