<page-header>
	<div class="form-group" fxFlex>
		<label>Search</label>
		<div class="input-group">
			<input type="text" class="form-control" placeholder="Search.." (keyup)="searchChanged($event.target.value)"
				[value]="queryParams.search">
			<div class="input-group-append">
				<span class="input-group-text">
					<i class="fas fa-search"></i>
				</span>
			</div>
		</div>
	</div>
	<button class="btn btn-primary" (click)="addSalesAgent()"><i class="fas fa-plus mr-2"></i>Add Sales Agent</button>
</page-header>
<page-body>
	<panel>
		<panel-body class="p-0">
			<ng-container *ngIf="isInitialized">
				<mat-table class="data-grid" #dataGrid [dataSource]="dataSource" matSort matSortDisableClear>

					<ng-container matColumnDef="no">
						<mat-header-cell fxFlex="60px" mat-sort-header *matHeaderCellDef> No.
						</mat-header-cell>
						<mat-cell fxFlex="60px" *matCellDef="let row; let i = index">
							{{ row.no }}
						</mat-cell>
					</ng-container>

					<ng-container matColumnDef="salesAgentCode">
						<mat-header-cell fxFlex="120px" mat-sort-header *matHeaderCellDef>Code</mat-header-cell>
						<mat-cell fxFlex="120px" *matCellDef="let row">{{ row.salesAgentCode }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="fullName">
						<mat-header-cell fxFlex="200px" mat-sort-header *matHeaderCellDef>Sales Name
						</mat-header-cell>
						<mat-cell fxFlex="200px" *matCellDef="let row">{{ row.fullName }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="propertyAgentName">
						<mat-header-cell fxFlex mat-sort-header *matHeaderCellDef>Property Agent</mat-header-cell>
						<mat-cell fxFlex *matCellDef="let row">{{ row.propertyAgentName }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="handPhone">
						<mat-header-cell fxFlex="120px" mat-sort-header *matHeaderCellDef>Handphone</mat-header-cell>
						<mat-cell fxFlex="120px" *matCellDef="let row">{{ row.handPhone }}</mat-cell>
					</ng-container>

					<ng-container matColumnDef="actions">
						<mat-header-cell fxFlex="50px" *matHeaderCellDef></mat-header-cell>
						<mat-cell fxFlex="50px" *matCellDef="let row">
							<button class="btn btn-primary btn-sm" (click)="editSalesAgent(row.salesAgentId)"><i
									class=" fas fa-pen"></i></button>
						</mat-cell>
					</ng-container>

					<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
					<mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
				</mat-table>
			</ng-container>
			<ng-container *ngIf="!isInitialized">
				<div class="loading-container">
					<loading></loading>
				</div>
			</ng-container>
			<mat-paginator [pageSizeOptions]="[10, 50, 100]" showFirstLastButtons (page)="pageChanged($event)">
			</mat-paginator>
		</panel-body>
	</panel>
</page-body>
