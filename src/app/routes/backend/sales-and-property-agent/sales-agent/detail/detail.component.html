<ng-container *ngIf="isInitialized">
	<mat-dialog-content>
		<h2 class="text-success">{{ salesAgentCode || 'New'}}</h2>
		<h1>{{ fullName.value || 'New Sales Agent'}}</h1>
	</mat-dialog-content>
	<mat-dialog-content fxLayout="column" class="p-0">
		<div class="tabs">
			<div class="tab-header" fxLayout>
				<div [class.active]="selectedTab === 'detail'" (click)="selectedTab = 'detail'">Detail</div>
				<div [class.active]="selectedTab === 'transaction-history'"
					(click)="selectedTab = 'transaction-history'">
					Transaction History
				</div>
			</div>
			<div class="tab-contents">
				<div class="tab-content" fxHide [fxShow]="selectedTab === 'detail'">
					<form [formGroup]="formGroup" novalidate class="needs-validation" (ngSubmit)="submit()"
						fxLayout="column">
						<ng-container *ngIf="salesAgentId">
							<div fxLayout fxLayoutGap="10px">
								<div class="form-group" fxFlex="120px">
									<label>Code</label>
									<input class="form-control" [(ngModel)]="salesAgentCode" readonly
										[ngModelOptions]="{standalone: true}">
								</div>
								<div class="form-group" fxFlex>
									<label>Full Name</label>
									<input class="form-control" formControlName="fullName"
										[class.is-invalid]="fullName.invalid && formSubmitAttempt">
								</div>
							</div>
						</ng-container>
						<ng-container *ngIf="!salesAgentId">
							<div class="form-group" fxFlex>
								<label>Full Name</label>
								<input class="form-control" formControlName="fullName"
									[class.is-invalid]="fullName.invalid && formSubmitAttempt">
							</div>
						</ng-container>
						<div fxLayout fxLayoutGap="10px">
							<div class="form-group" fxFlex="100px">
								<label>Gender</label>
								<select class="form-control" formControlName="genderId">
									<option value="1">Male</option>
									<option value="2">Female</option>
								</select>
							</div>
							<div class="form-group" fxFlex="140px">
								<label>Birth Date</label>
								<div class="input-group">
									<input [matDatepicker]="datePicker" class="form-control" (click)="datePicker.open()"
										formControlName="dob" />
									<div class="input-group-append">
										<span class="input-group-text" (click)="datePicker.open()"><i
												class="far fa-calendar-alt"></i></span>
									</div>
									<mat-datepicker #datePicker></mat-datepicker>
								</div>
							</div>
							<div class="form-group" fxFlex>
								<label>Identity Code (KTP)</label>
								<input class="form-control" formControlName="identityCode">
							</div>
						</div>
						<div fxLayout fxLayoutGap="10px">
							<div class="form-group" fxFlex>
								<label>Handphone</label>
								<input class="form-control" formControlName="handPhone">
							</div>
							<div class="form-group" fxFlex>
								<label>Email</label>
								<input class="form-control" formControlName="email">
							</div>
						</div>
						<div fxLayout fxLayoutGap="10px">
							<div class="form-group" fxFlex>
								<label>Bank Account Code</label>
								<input class="form-control" formControlName="handPhone">
							</div>
							<div class="form-group" fxFlex="160px">
								<label>Bank Name</label>
								<input class="form-control" formControlName="email">
							</div>
						</div>
						<div class="form-group mb-0">
							<label>Property Agent</label>
							<select class="form-control" formControlName="propertyAgentId"
								[class.is-invalid]="propertyAgentId.invalid && formSubmitAttempt">
								<option value="0">Select Property Agent</option>
								<option *ngFor="let p of propertyAgents" [value]="p.propertyAgentId">{{
									p.propertyAgentName }}</option>
							</select>
						</div>
						<button fxHide></button>
					</form>
					<error-message>{{ errorMessage }}</error-message>
				</div>
				<div class="tab-content p-0" fxHide [fxShow]="selectedTab === 'transaction-history'" fxLayout="column">
					tab 2
				</div>
			</div>
		</div>
	</mat-dialog-content>
	<mat-dialog-actions fxLayout fxLayoutGap="10px">
		<button class="btn btn-danger" (click)="deleteSalesAgent()"><i class="far fa-trash-alt mr-2"></i>Delete</button>
		<span fxFlex></span>
		<loading-button className="btn btn-primary" (click)="submit()"><i class="fa fa-save mr-1"></i>
			Save</loading-button>
		<button mat-dialog-close class="btn btn-danger">
			<i class="fa fa-times mr-1"></i> Close
		</button>
	</mat-dialog-actions>
</ng-container>
<ng-container *ngIf="!isInitialized">
	<loading></loading>
</ng-container>
