<div class="login-page">
	<div class="login-card">
		<h1>Global Trans</h1>
		<p>Silakan masuk ke akun Anda</p>

		<form [formGroup]="formGroup" (ngSubmit)="submit()">
			<div class="form-group">
				<label for="email"> Email </label>

				<input
					id="email"
					type="email"
					formControlName="email"
					autocomplete="username"
				/>

				<div
					class="error-message"
					*ngIf="
						formGroup.get('email')?.touched &&
						formGroup.get('email')?.invalid
					"
				>
					<span *ngIf="formGroup.get('email')?.hasError('required')">
						Email wajib diisi.
					</span>

					<span *ngIf="formGroup.get('email')?.hasError('email')">
						Format email tidak valid.
					</span>
				</div>
			</div>

			<div class="form-group">
				<label for="password"> Password </label>

				<input
					id="password"
					type="password"
					formControlName="password"
					autocomplete="current-password"
				/>

				<div
					class="error-message"
					*ngIf="
						formGroup.get('password')?.touched &&
						formGroup.get('password')?.invalid
					"
				>
					Password wajib diisi.
				</div>
			</div>

			<div class="error-message server-error" *ngIf="errorMessage">
				{{ errorMessage }}
			</div>

			<button type="submit" [disabled]="isSubmitting">
				{{ isSubmitting ? "Memproses..." : "Login" }}
			</button>
		</form>
	</div>
</div>
