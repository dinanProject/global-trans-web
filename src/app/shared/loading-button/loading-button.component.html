<button [ngClass]="className" [type]="type" [disabled]="isLoading || disabled">
	<ng-container *ngIf="isLoading; else buttonContent">
		<span
			class="spinner-border spinner-border-sm mr-2"
			role="status"
			aria-hidden="true"
		></span>

		{{ loadingText }}
	</ng-container>

	<ng-template #buttonContent>
		<ng-content></ng-content>
	</ng-template>
</button>
