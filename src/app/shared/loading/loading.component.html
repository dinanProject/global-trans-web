<div
	class="loading"
	[style.left]="left"
	[style.top]="top"
	fxLayout="column"
	fxLayoutAlign="center center"
	fxLayoutGap="10px"
>
	<div
		class="spinner-border text-primary"
		role="status"
		[style.width]="size"
		[style.height]="size"
	></div>

	<ng-container *ngIf="text">
		<label [style.color]="textColor">{{ text }}</label>
	</ng-container>
</div>
