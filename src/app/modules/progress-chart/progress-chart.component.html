<div class="progress-chart" [style.width]="width === 0 ? '' : width" [style.background]="maxColor"
	[style.border-radius.px]="height / 2">
	<div class="chart-value" [style.width]="getValuePercent() + '%'" [style.background]="valueColor"
		[style.height.px]="height" [style.border-radius.px]="height / 2"></div>
</div>
