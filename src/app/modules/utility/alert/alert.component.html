<mat-dialog-content fxLayout="column" fxLayoutAlign="center center">
	<i [ngClass]="iconClass"></i>
	<h4 class="font-weight-bold text-center">{{ title }}</h4>
	<p class="text-center text-secondary">{{ description }}</p>
	<button class="btn btn-lg" [ngClass]="buttonClass" (click)="submit()">OK</button>
</mat-dialog-content>
