	<style>
		.loading {
			width: 100%;
			height: 100%;
			text-align: center;
			flex-direction: column;
			box-sizing: border-box;
			display: flex;
			place-content: center;
			align-items: center;
			/* transform: translate(-50%, -50%); */
		}

		.loading label {
			white-space: nowrap;
			margin-top: 10px;
			margin-bottom: 0px;
		}

<body>
	<app-root>
		<div class="loading">
			<div class="spinner-border text-primary" role="status" [style.width]="size" [style.height]="size"></div>
			<label [style.color]="textColor">Please wait ..</label>
		</div>
	</app-root>
