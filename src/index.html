<!doctype html>
<html lang="id-ID">

<head>
	<meta charset="utf-8" />
	<title>Global Trans</title>
	<base href="/" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<link rel="icon" type="image/x-icon" href="favicon.ico" />

	<script>
		(function () {
			var theme = 'light';
			var isLoginRoute = window.location.pathname.indexOf('/auth/login') === 0;

			if (!isLoginRoute) {
				try {
					theme = localStorage.getItem('global-trans-theme') === 'dark' ? 'dark' : 'light';
				} catch (e) {
					theme = 'light';
				}
			}

			document.documentElement.setAttribute('data-theme', theme);
			document.documentElement.style.colorScheme = theme;
		})();
	</script>

	<style>
		/*
		 * First-paint fallback only. The semantic theme remains authoritative in
		 * _theme-tokens.scss; these values mirror --app-background so the browser
		 * never paints its default white canvas before the compiled CSS is ready.
		 */
		html,
		body {
			background: #fafafa;
		}

		html[data-theme="dark"],
		html[data-theme="dark"] body {
			background: #0d1117;
		}

		.loading {
			width: 100%;
			height: 100%;
			text-align: center;
			flex-direction: column;
			box-sizing: border-box;
			display: flex;
			place-content: center;
			align-items: center;
		}

		.loading label {
			white-space: nowrap;
			margin-top: 10px;
			margin-bottom: 0px;
		}
	</style>
</head>

<body>
	<app-root>
		<div class="loading">
			<div class="spinner-border text-primary" role="status" [style.width]="size" [style.height]="size"></div>
			<label [style.color]="textColor">Please wait ..</label>
		</div>
	</app-root>
</body>

</html>
