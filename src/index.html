<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Global Trans</title>
		<base href="/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />

		<style>
			.loading {
				width: 100%;
				height: 100%;
				text-align: center;
				flex-direction: column;
				box-sizing: border-box;
				display: flex;
				place-content: center;
				align-items: center;
			}

			.loading label {
				white-space: nowrap;
				margin-top: 10px;
				margin-bottom: 0px;
			}
		</style>
	</head>

	<body>
		<app-root>
			<div class="loading">
				<div
					class="spinner-border text-primary"
					role="status"
					[style.width]="size"
					[style.height]="size"
				></div>
				<label [style.color]="textColor">Please wait ..</label>
			</div>
		</app-root>
	</body>
</html>
